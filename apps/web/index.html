<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#6F4E37" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>StudyMap - Bản Đồ Cà Phê & Góc Học Bài Cho Sinh Viên</title>
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link href="https://unpkg.com/maplibre-gl@5.2.0/dist/maplibre-gl.css" rel="stylesheet" />
    <style>
      *, *::before, *::after { box-sizing: border-box; }
      :root {
        --ssg-bg: #FAF7F2;          /* nền giấy ấm (tông cà phê) */
        --ssg-surface: #FFFFFF;
        --ssg-border: #EAE3D9;
        --ssg-text: #261C14;        /* nâu than ấm, không đen tuyệt đối */
        --ssg-muted: #7A6C60;
        --ssg-accent: #6F4E37;      /* nâu cà phê: một màu nhấn duy nhất */
        --ssg-accent-soft: #F2E7DA;
      }
      html, body, #root { margin: 0; padding: 0; width: 100%; max-width: 100vw; overflow-x: hidden; }
      body { font-family: 'Be Vietnam Pro', 'Segoe UI', system-ui, -apple-system, sans-serif; color: var(--ssg-text); background: var(--ssg-bg); line-height: 1.6; -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; }
      h1, h2, h3, h4, .ant-typography h1, .ant-typography h2, .ant-typography h3 { letter-spacing: -0.02em; text-wrap: balance; }
      p { text-wrap: pretty; }
      img { max-width: 100%; }
      ::selection { background: var(--ssg-accent-soft); color: var(--ssg-text); }
      a, button, [role=button] { transition: background-color .2s ease, color .2s ease, border-color .2s ease, transform .2s cubic-bezier(.16,1,.3,1), box-shadow .2s ease; }
      .ant-btn:active { transform: scale(0.98); }
      .ant-card { transition: box-shadow .2s ease, transform .2s cubic-bezier(.16,1,.3,1); }
      :focus-visible { outline: 2px solid var(--ssg-accent); outline-offset: 2px; }
      html { scroll-behavior: smooth; }
      @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; scroll-behavior: auto !important; } }
      /* mờ nhẹ khi phần tử xuất hiện (chỉ transform/opacity) */
      .ssg-fade-in { animation: ssgFadeIn .5s cubic-bezier(.16,1,.3,1) both; }
      @keyframes ssgFadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
          /* Thanh cuộn mảnh cho menu admin (WebKit) */
      .ssg-admin-menu::-webkit-scrollbar { width: 6px; }
      .ssg-admin-menu::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.18); border-radius: 3px; }
      .ssg-admin-menu::-webkit-scrollbar-track { background: transparent; }
      /* Admin trên màn hình hẹp: khối tiêu đề trang xuống dòng, chữ nhỏ hơn, không tràn */
      @media (max-width: 991px) {
        .ssg-admin-content > div > div:first-child { flex-wrap: wrap !important; align-items: flex-start !important; gap: 10px; }
        .ssg-admin-content h4.ant-typography { font-size: 18px !important; margin-bottom: 4px !important; }
        .ssg-admin-content .ant-space-wrap, .ssg-admin-content .ant-space { flex-wrap: wrap; max-width: 100%; }
        .ssg-admin-content .ant-tabs-nav .ant-tabs-tab { padding: 8px 10px !important; font-size: 13px; }
        .ssg-admin-content .ant-card-body { padding: 12px !important; }
        .ssg-admin-content .ant-modal { max-width: calc(100vw - 16px) !important; margin: 8px auto !important; }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
