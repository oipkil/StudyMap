# /etc/nginx/sites-available/studymap.online — web tĩnh + proxy API/Socket.IO/SEO về container ssg-server (127.0.0.1:4000)
# certbot --nginx sẽ tự thêm khối 443 + chuyển hướng HTTP -> HTTPS.
server {
    listen 80;
    listen [::]:80;
    server_name studymap.online www.studymap.online;

    root /var/www/studymap;
    index index.html;
    client_max_body_size 25m;

    # Bảo mật cơ bản
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Cho phép Let's Encrypt xác thực
    location ^~ /.well-known/acme-challenge/ { root /var/www/certbot; }

    # API
    location /api/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;   # chat AI stream dài
        proxy_buffering off;
    }

    # Socket.IO (WebSocket)
    location /socket.io/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }

    # SEO / sức khỏe do server sinh
    location = /sitemap.xml { proxy_pass http://127.0.0.1:4000; proxy_set_header Host $host; }
    location = /robots.txt  { proxy_pass http://127.0.0.1:4000; proxy_set_header Host $host; }
    location = /health      { proxy_pass http://127.0.0.1:4000; }
    location = /ready       { proxy_pass http://127.0.0.1:4000; }
    location ^~ /share/     { proxy_pass http://127.0.0.1:4000; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; }

    # Hộp thư demo (Mailpit) — có mật khẩu, để nhóm xem email xác minh/đặt lại mật khẩu
    location ^~ /mailpit/ {
        auth_basic "SSG Mailpit";
        auth_basic_user_file /etc/nginx/.htpasswd-mailpit;
        proxy_pass http://127.0.0.1:8025;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }

    # Tài nguyên build có hash -> cache dài
    location ~* \.(js|css|woff2?|png|jpg|jpeg|svg|ico|webp)$ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    # SPA
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
