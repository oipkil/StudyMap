# Production trên VPS (studymap.online). Chạy trong /opt/ssg trên máy chủ:
#   docker compose -f deploy/docker-compose.prod.yml --env-file deploy/.env.prod up -d --build
# Nginx trên máy chủ phục vụ web tĩnh (/var/www/studymap) và proxy /api, /socket.io -> 127.0.0.1:4000.
services:
  ssg-postgres:
    image: postgres:16-alpine
    container_name: ssg-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ssg_admin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ssg_db
    volumes:
      - ssg_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ssg_admin -d ssg_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  ssg-redis:
    image: redis:7-alpine
    container_name: ssg-redis
    restart: unless-stopped
    volumes:
      - ssg_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  ssg-mailpit:
    image: axllent/mailpit:latest
    container_name: ssg-mailpit
    restart: unless-stopped
    # Web UI chỉ mở cho localhost; nginx đưa ra ngoài tại /mailpit/ có basic auth
    ports:
      - "127.0.0.1:8025:8025"
    environment:
      MP_MAX_MESSAGES: 500
      MP_WEBROOT: /mailpit/

  ssg-server:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: ssg-server:latest
    container_name: ssg-server
    restart: unless-stopped
    depends_on:
      ssg-postgres:
        condition: service_healthy
      ssg-redis:
        condition: service_healthy
    env_file:
      - .env.prod
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://ssg_admin:${POSTGRES_PASSWORD}@ssg-postgres:5432/ssg_db?schema=public
      REDIS_URL: redis://ssg-redis:6379
      SMTP_HOST: ssg-mailpit
      SMTP_PORT: 1025
      TRUST_PROXY: 1
    ports:
      - "127.0.0.1:4000:4000"
    volumes:
      - ssg_uploads:/app/apps/server/uploads
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:4000/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  ssg_pgdata:
  ssg_redisdata:
  ssg_uploads:
